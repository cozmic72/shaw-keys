<!-- Virtual Keyboard Settings — two-view stack inside the one #vk-settings-dialog.
     View 1 (#vk-view-picker) = the layout picker; view 2 (#vk-view-editor) = the
     layout editor, injected by layout-editor.js. The dialog controller
     (virtual-keyboard.js) swaps which view is visible; the editor renders into
     #vk-view-editor, never a second modal.

     Round 2: one flat radio list holds BOTH built-in and custom layouts (custom
     rows carry a "custom" chip + an inline ✏️ edit control). The live HTML preview
     (renderLayoutPreview) + a compact description + a ligatures disclosure appear
     INLINE, directly beneath the SELECTED row — no detached side panel. The
     preview keyboard's own ⇧ key flips base⇄shift (no checkbox). Rows are built by
     renderPickerList() in virtual-keyboard.js; #vk-detail-template is the inline
     block cloned under the selected row. -->
<div id="vk-view-picker" class="vk-view">
<div class="vk-settings">
    <h3 data-i18n="vkLayoutHeading">Layout</h3>

    <!-- Flat radio list: built-in + custom rows, built by renderPickerList(). The
         selected row hosts the inline detail (preview + description + ligatures). -->
    <div class="vk-layout-list" id="vk-layout-list"></div>

    <!-- One compact create/import affordance below the list. New… opens the
         in-surface base-picker overlay (built by openBasePicker); Import… loads a
         JSON file. No inline base <select> — the clone source is chosen in the overlay. -->
    <div class="vk-create-bar">
        <button type="button" class="vk-create-btn" id="vk-create-new" data-i18n="vkNew">New…</button>
        <button type="button" class="vk-create-btn" id="vk-create-import" data-i18n="vkImport">Import…</button>
        <input type="file" id="vk-create-file" accept="application/json" style="display: none;">
    </div>

    <!-- Base-picker overlay: a viewport-level modal (NOT a nested <dialog>.showModal)
         shown when New… is clicked. openBasePicker fills .vk-base-list with a button
         per clone source and REPARENTS this element clear of the picker's scroll box
         (see promoteBasePicker) so it is never clipped; closeBasePicker puts it back.
         Picking one clones + opens the editor. Dismissed via backdrop, Cancel, or
         Escape. Hidden until opened. -->
    <div class="vk-base-overlay" id="vk-base-overlay" hidden>
        <div class="vk-base-panel" role="dialog" aria-modal="true" aria-labelledby="vk-base-title">
            <h4 class="vk-base-title" id="vk-base-title" data-i18n="vkStartFrom">Start from…</h4>
            <div class="vk-base-list" id="vk-base-list"></div>
            <div class="vk-base-actions">
                <button type="button" class="vk-create-btn" id="vk-base-cancel" data-i18n="vkCancel">Cancel</button>
            </div>
        </div>
    </div>
</div>

<!-- Cloned by renderPickerList() and inserted under the selected row. Holds the
     description, the scaled live preview, and the ligature list (rendered inline,
     always expanded; hidden entirely when the layout has no ligatures).
     The .vk-detail-grid/.vk-detail-body pair is the collapse mechanism — see the
     grid-template-rows rules below; the body must stay the grid's ONLY child. -->
<template id="vk-detail-template">
    <div class="vk-inline-detail">
        <div class="vk-detail-grid">
            <div class="vk-detail-body">
                <p class="vk-detail-desc"></p>
                <div class="vk-preview-host"></div>
                <div class="vk-lig-section">
                    <span class="vk-lig-label" data-i18n="vkLigatures">Ligatures</span>
                    <div class="vk-lig-body"></div>
                </div>
            </div>
        </div>
    </div>
</template>
</div><!-- /#vk-view-picker -->

<!-- View 2 host: the editor injects its markup here (layout-editor.js). Hidden
     until the controller swaps to the editor view. -->
<div id="vk-view-editor" class="vk-view" style="display: none;"></div>

<style>
.vk-settings {
    margin: 0;
}

.vk-settings h3 {
    margin-top: 0;
    margin-bottom: 0.5em;
}

/* Form controls do not inherit font-family — without this the UA's system font
   wins. A custom layout's label may be Shavian (customLayoutLabel), and only
   Inter-Alia draws the VS1 variants, so the dropdown and roster need it named.
   The base overlay is listed separately because promoteBasePicker reparents it
   clear of .vk-settings. */
.vk-settings input,
.vk-settings button,
.vk-settings select,
.vk-settings textarea,
.vk-base-overlay button {
    font-family: 'Inter-Alia', sans-serif;
}

/* Flat radio list of layouts (built-in + custom). */
.vk-layout-list {
    display: flex;
    flex-direction: column;
    gap: 0.4em;
}

/* WIDE geometry: give the list + inline preview room to breathe (the inline
   detail still sits under the selected row, just wider). Cap the whole picker so
   the preview doesn't scale up to an unwieldy size on a big desktop dialog. */
.vk-geo-wide .vk-layout-list {
    max-width: 620px;
}

/* MOBILE geometry: a native dropdown replaces the radio rows. */
.vk-dropdown-bar {
    display: flex;
    align-items: center;
    gap: 0.4em;
}

.vk-dropdown {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    font-size: 15px;
    border: 2px solid #ccc;
    border-radius: 8px;
    background: #fff;
}

.vk-dropdown-edit {
    flex: 0 0 auto;
}

.vk-dropdown-edit:disabled {
    opacity: 0.4;
    cursor: default;
}

.vk-layout-choice {
    display: flex;
    align-items: center;
    gap: 0.4em;
    padding: 0.4em 0.6em;
    border: 2px solid #ddd;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.2s, background-color 0.2s;
}

/* Hover highlight only on true hover-capable pointers: on touch (iPad) :hover
   sticks to the last-tapped row, leaving a stray border on an unselected row. */
@media (hover: hover) {
    .vk-layout-choice:hover {
        border-color: #007bff;
        background-color: #f8f9fa;
    }
}

.vk-layout-choice:has(input[type="radio"]:checked) {
    border-color: #007bff;
    background-color: #e7f3ff;
}

/* Keyboard focus ring only (focus-visible) — a tap must not leave a lingering
   focus outline on a row's radio, but Tab-navigation keeps an accessible ring. */
.vk-layout-choice:has(input[type="radio"]:focus-visible) {
    outline: 2px solid #007bff;
    outline-offset: 1px;
}

.vk-layout-choice input[type="radio"] {
    margin: 0;
    cursor: pointer;
}

.vk-choice-name {
    font-weight: 500;
    user-select: none;
    flex: 1;
    min-width: 0;
}

/* Subtle "custom" chip marking a user layout in the flat list. */
.vk-custom-chip {
    font-size: 0.7em;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #6b57c8;
    background: #efeaff;
    border: 1px solid #d9cffb;
    border-radius: 4px;
    padding: 1px 5px;
    white-space: nowrap;
}

/* Per-custom-row inline edit affordance (built-ins have none). */
.vk-edit-btn {
    flex: 0 0 auto;
    padding: 2px 8px;
    font-size: 13px;
    line-height: 1.4;
    border: 1px solid #d5d5d5;
    border-radius: 6px;
    background: #fff;
    color: #444;
    cursor: pointer;
}

.vk-edit-btn:hover {
    background: #f3f3f3;
    border-color: #007bff;
}

/* Inline detail block, inserted directly beneath the selected row so the preview
   reads as attached to it (fixes the round-1 "detached panel" complaint). */
.vk-inline-detail {
    margin: -0.1em 0 0.2em 0;
    padding: 0.6em 0.7em 0.7em;
    border: 2px solid #cfe3ff;
    border-top: none;
    border-radius: 0 0 6px 6px;
    background: #f4f9ff;
}

/* Switch-layout continuity: the outgoing detail collapses while the incoming one
   expands, so the clicked row doesn't jump. The browser owns every number here —
   grid-template-rows 1fr->0fr animates to the CONTENT's intrinsic height with no
   measuring. Nothing is left constraining the settled panel, so the scaled preview
   can never end up clipped. Keep in step with DETAIL_ANIM_MS. */
.vk-detail-grid {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.2s ease;
}

/* min-height:0 is what lets the 0fr track actually squash its content; overflow
   here (not on the panel) keeps the clipping strictly inside the animating box. */
.vk-detail-body {
    min-height: 0;
    overflow: hidden;
}

/* Collapsed: zero content track, and the panel's own padding/border go with it —
   otherwise a fully collapsed detail leaves a visible stripe behind. */
.vk-inline-detail.vk-detail-collapsed {
    padding-top: 0;
    padding-bottom: 0;
    border-bottom-width: 0;
    opacity: 0;
}

.vk-inline-detail.vk-detail-collapsed > .vk-detail-grid {
    grid-template-rows: 0fr;
}

.vk-inline-detail {
    transition: padding 0.2s ease, border-bottom-width 0.2s ease, opacity 0.2s ease;
}

@media (prefers-reduced-motion: reduce) {
    .vk-detail-grid,
    .vk-inline-detail {
        transition: none;
    }
}

.vk-detail-desc {
    margin: 0 0 0.5em;
    color: #555;
    line-height: 1.4;
    font-size: 0.9em;
}

.vk-cov-badge {
    font-weight: 600;
    white-space: nowrap;
}
.vk-cov-complete {
    color: #1a7f37;   /* green ✓ */
}
.vk-cov-incomplete {
    color: #b35900;   /* amber ⚠ */
}

/* Preview host: the scaler inside is transform-scaled to fit by
   scalePreviewToWidth(). The scaler is absolutely positioned so its natural
   (unscaled) width never widens the column — otherwise the keyboard's intrinsic
   width would push the picker past the mount and clip. The host's own
   width/height are set explicitly by scalePreviewToWidth. */
.vk-preview-host {
    position: relative;
    max-width: 100%;
    overflow: hidden;
}

.vk-preview-scaler {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
    width: max-content;
}

/* A preview keyboard body: reuse the live .keyboard-body geometry but strip the
   window chrome context (no header). Only the ⇧ key takes pointer input (it flips
   the layer); everything else is display-only. */
.vk-preview-body {
    margin: 0;
}

.vk-preview-body .key {
    pointer-events: none;
}

.vk-preview-body .key[data-key="Shift"] {
    pointer-events: auto;
    cursor: pointer;
}

/* The clickable preview cap is the only preview key taking pointer input, so a TAP
   on iPad lands (and STICKS) the global .key:hover raise. Reset it here on touch;
   restore the hover feedback only on true hover-capable pointers. */
.vk-preview-body .key:hover {
    transform: none;
    box-shadow: none;
}
@media (hover: hover) {
    .vk-preview-body .key[data-key="Shift"]:hover {
        transform: translateY(-1px);
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.4);
    }
}

/* One-shot pulse inviting the user to tap ⇧ (added on first preview render, then
   removed on animationend so it never loops). animationend fires once, after the
   last of the 2 iterations — so the single-fire {once:true} remover is enough. */
.vk-preview-body .key.vk-shift-pulse {
    animation: vk-shift-pulse 0.9s ease-in-out 2;
}

@keyframes vk-shift-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0, 123, 255, 0); }
    50% { box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.5); }
}

/* Ligatures — rendered inline, always expanded. Built-ins carry only 0–8, so the
   list is about as tall as a collapsed summary would be; hidden entirely (via JS)
   when the layout has none. */
.vk-lig-section {
    margin-top: 0.6em;
    font-size: 0.85em;
}

.vk-lig-label {
    color: #444;
    font-weight: 600;
    user-select: none;
}

.vk-lig-body {
    margin-top: 0.4em;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35em;
}

.vk-lig-item {
    border: 1px solid #d9cffb;
    background: #fff;
    border-radius: 5px;
    padding: 2px 6px;
    white-space: nowrap;
}

/* One compact create/import affordance below the list. */
.vk-create-bar {
    display: flex;
    align-items: center;
    gap: 0.4em;
    flex-wrap: wrap;
    margin-top: 0.9em;
    padding-top: 0.8em;
    border-top: 1px solid #e0e0e0;
}

.vk-create-btn {
    padding: 6px 12px;
    font-size: 13px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    background: #fff;
    color: #444;
    cursor: pointer;
}

.vk-create-btn:hover {
    background: #f3f3f3;
}

/* Base-picker overlay. openBasePicker reparents it out of the picker (into the
   settings <dialog> when open, else <body>) so no scroll box can clip it, and
   position:fixed then resolves its box against the VIEWPORT. z-index clears the
   game's own settings modal (z-index 2000); inside the top-layer <dialog> the
   stacking is already above ::backdrop. Not a nested <dialog>.showModal — see
   promoteBasePicker. */
.vk-base-overlay[hidden] {
    display: none;   /* [hidden] must beat the display:flex below */
}

.vk-base-overlay {
    position: fixed;
    inset: 0;
    z-index: 2500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: rgba(0, 0, 0, 0.35);
}

.vk-base-panel {
    display: flex;
    flex-direction: column;
    max-height: 100%;   /* the fixed overlay is the viewport, so this is viewport-bounded */
    width: 100%;
    max-width: 320px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
    padding: 14px;
    box-sizing: border-box;
}

.vk-base-title {
    margin: 0 0 0.6em;
    font-size: 15px;
}

.vk-base-list {
    display: flex;
    flex-direction: column;
    gap: 0.4em;
    overflow-y: auto;
    min-height: 0;   /* let the list scroll instead of clipping on mobile */
}

.vk-base-option {
    padding: 8px 12px;
    font-size: 14px;
    text-align: left;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    background: #fff;
    color: #444;
    cursor: pointer;
}

.vk-base-option:hover {
    background: #f3f3f3;
}

.vk-base-actions {
    margin-top: 0.8em;
    display: flex;
    justify-content: flex-end;
}
</style>

<!-- Event handlers are attached by loadVirtualKeyboardSettingsHTML in virtual-keyboard.js -->
